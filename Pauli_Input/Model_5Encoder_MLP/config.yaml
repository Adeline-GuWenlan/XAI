# =============================================================================
# PARAMETER SEARCH SPACES (for hyperparameter optimization)
# =============================================================================
# Define search spaces for automated hyperparameter tuning
search_spaces:
  d_model: [32, 64, 128, 256]
  nhead: [2, 4, 8]
  num_encoder_layers: [1, 2, 3, 4]
  dim_feedforward: [256, 512, 1024]
  batch_size: [16, 32, 64]
  learning_rate: [0.0001, 0.0005, 0.001, 0.005]
  lasso_lambda: [0.001, 0.01, 0.1]
  gbdt_n_estimators: [50, 100, 200]
  gbdt_max_depth: [2, 3, 4, 5]

# =============================================================================
# NOTES ON PARAMETER TUNING
# =============================================================================
#
# Key parameters to tune first (highest impact):
# 1. d_model (32-256): Controls model capacity
# 2. num_encoder_layers (1-4): Depth of transformer
# 3. learning_rate (0.0001-0.005): Critical for convergence
# 4. head type (mlp/ensemble/lasso/gbdt): Different inductive biases
#
# For Ensemble head:
# - Start with equal weights (1.0, 1.0, 1.0)
# - If validation loss plateaus, try emphasizing shallow (faster patterns)
# - If underfitting, try emphasizing deep (complex patterns)
#
# For Lasso head:
# - Higher lambda = sparser model (good for interpretability)
# - Lower lambda = more capacity (better fit)
# - Start with 0.01 and adjust based on validation performance
#
# For GBDT head:
# - n_estimators vs learning_rate: trade-off (more trees = lower LR)
# - max_depth controls complexity: start with 3, increase if underfitting
# - subsample < 1.0 adds regularization (good for large datasets)
#
# Parameter constraints:
# - d_model must be divisible by nhead
# - Larger models need lower learning rates
# - Deeper models may need more training epochs
